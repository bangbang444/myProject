version: '3.8'

services:
  gourmet-app:
    image: ${DOCKER_REGISTRY}/gourmet-backend:${APP_TAG}
    container_name: ${APP_NAME}
    ports:
      - "${HOST_IP}:${APP_DEPLOY_PORT}:8080"
    networks:
      - gourmet-net
    restart: always
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080${HEALTH_CHECK_PATH}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gourmet-net:
    external: true
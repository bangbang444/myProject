version: '3.8'

services:
  mysql:
    image: mysql:${DB_TAG}
    container_name: mysql-gourmet
    restart: always
    ports:
      - "${HOST_IP}:${DB_PORT}:3306"
    networks:
      - gourmet-net
    env_file:
      - ../.env
    volumes:
      - ${DB_DATA}:/var/lib/mysql

  redis:
    image: redis:${REDIS_TAG}
    container_name: redis-gourmet
    restart: always
    ports:
      - "${HOST_IP}:${REDIS_PORT}:6379"
    networks:
      - gourmet-net
    env_file:
      - ../.env
    volumes:
      - ${REDIS_CONF}:/usr/local/etc/redis/redis.conf
      - ${REDIS_DATA}:/data
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"'

  gourmet-app:
    image: ${DOCKER_REGISTRY}/gourmet-backend:${APP_TAG}
    container_name: gourmet-backend-app
    ports:
      - "${HOST_IP}:${APP_DEPLOY_PORT}:8080"
    networks:
      - gourmet-net
    restart: always
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

networks:
  gourmet-net:
    external: true